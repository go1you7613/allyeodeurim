<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D01 로그인 | 알려드림 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/proto.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-body">
<!-- 화면 ID: D01 / 로그인 -->
<main class="auth">

<div data-state="default fail">
<div class="auth__brand"><h1>알려드림</h1><p>운영자 콘솔</p></div>
<div class="notice" data-state="fail" style="margin-bottom:16px"><i data-lucide="alert-circle"></i><p>아이디 또는 비밀번호가 맞지 않습니다. (남은 횟수 2회)</p></div>
<form class="form" onsubmit="return false">
  <div class="field"><label class="field__label"><span>아이디 </span></label><input class="input" placeholder="아이디"></div>
  <div class="field"><label class="field__label"><span>비밀번호 </span></label><input class="input" type="password" placeholder="비밀번호"></div>
  <a class="btn btn--primary btn--block" href="D10.html">로그인</a>
</form>
<p class="muted small mt-6" style="text-align:center">접속 허용 IP에서만 열립니다. 30분 동안 사용하지 않으면 자동으로 로그아웃됩니다.</p>
</div>
<div data-state="ipblock" style="text-align:center">
  <div class="empty"><i data-lucide="shield-x"></i><p>접속이 허용되지 않은 IP입니다.</p></div>
  <p class="muted small mt-4">허용되지 않은 IP에서는 로그인 화면을 열지 않습니다.</p>
</div>
</main>

<script src="../js/proto.js"></script>
</body>
</html>
