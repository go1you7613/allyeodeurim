<main class="admin-main">
  <div class="page-head"><div><p class="crumb">앱 운영 &gt; 앱 공지</p><h1>앱 공지 등록, 수정</h1></div></div>

<section class="panel" style="max-width:860px">

    <div class="field"><label class="field__label"><span>제목 <span class="field__req">필수</span></span><span class="field__count" data-count-for="ntt"></span></label><input class="input" id="ntt" maxlength="100" value="서버 점검 안내 (11.20 새벽)"></div>

    <div class="inline"><div class="field"><label class="field__label"><span>게시 시작 </span><span class="field__req">필수</span></label><input class="input" type="datetime-local" value="2026-11-15T09:00"></div><div class="field"><label class="field__label"><span>게시 종료 </span><span class="field__req">필수</span></label><input class="input" type="datetime-local" value="2026-11-20T06:00"></div></div>
    <div class="form-actions"><a class="btn btn--ghost" href="D60.html">취소</a><a class="btn btn--primary" href="D60.html">저장</a></div>
