<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B01 로그인 | 알려드림 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/proto.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-body">
<!-- 화면 ID: B01 / 로그인 -->
<main class="auth">

<div class="auth__brand"><h1>알려드림</h1><p>기관 관리자</p></div>
<div class="notice" data-state="fail" style="margin-bottom:16px"><i data-lucide="alert-circle"></i><p>아이디 또는 비밀번호가 맞지 않습니다. (남은 횟수 2회)</p></div>
<div class="notice" data-state="locked" style="margin-bottom:16px"><i data-lucide="lock"></i><p>로그인 5회 실패로 계정이 잠겼습니다. 담당자는 대표 관리자에게, 대표 관리자는 운영자에게 잠금 해제를 요청하세요.</p></div>
<div class="notice" data-state="ended" style="margin-bottom:16px"><i data-lucide="ban"></i><p>계약이 종료된 기관이거나 사용 중지된 계정입니다.</p></div>
<form class="form" onsubmit="return false">
  <div class="field"><label class="field__label"><span>아이디 </span></label><input class="input" id="lid" autocomplete="username" placeholder="아이디"></div>
  <div class="field"><label class="field__label"><span>비밀번호 </span></label><input class="input" type="password" autocomplete="current-password" placeholder="비밀번호"></div>
  <a class="btn btn--primary btn--block" href="B10.html">로그인</a>
</form>
<div class="auth__links"><a href="B02.html">비밀번호 찾기</a><a href="B03.html">첫 로그인 (임시 비밀번호)</a></div>
<p class="muted small mt-6" style="text-align:center">30분 동안 사용하지 않으면 자동으로 로그아웃됩니다.</p>
</main>

<script src="../js/proto.js"></script>
</body>
</html>
