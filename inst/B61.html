<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B61 담당자 등록, 수정 | 알려드림 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/proto.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-area="inst" data-menu="B61">
<!-- 화면 ID: B61 / 담당자 등록, 수정 -->
<main class="admin-main">
  <div class="page-head"><div><p class="crumb">계정 &gt; 담당자 계정 관리</p><h1>담당자 등록, 수정</h1></div></div>

<section class="panel" style="max-width:720px">
  <form class="form" onsubmit="return false">
    <div data-state="default"><div class="field"><label class="field__label"><span>아이디 </span><span class="field__req">필수</span></label><div class="inline"><input class="input" placeholder="영문, 숫자"><button class="btn btn--outline btn--sm">중복 확인</button></div></div></div>
    <div data-state="edit"><div class="field"><label class="field__label"><span>아이디 </span></label><input class="input" value="gana_staff2" readonly></div></div>
    <div class="field"><label class="field__label"><span>이름 </span><span class="field__req">필수</span></label><input class="input" value=""></div>
    <div class="field"><label class="field__label"><span>업무 이메일 </span><span class="field__req">필수</span></label><input class="input" type="email" placeholder="name@example.go.kr"><p class="field__help">등록하면 이 주소로 임시 비밀번호를 보냅니다.</p></div>
    <div class="field"><label class="field__label"><span>권한 </span></label><input class="input" value="담당자" readonly></div>
    <div data-state="edit">
      <div class="row" style="justify-content:space-between;padding:12px 0;border-top:1px solid var(--c-border)">
        <div><p class="field__label">사용 여부</p><p class="field__help">사용 중지하면 바로 로그인할 수 없습니다. 작성한 기관 소식, 예약은 그대로 남습니다.</p></div>
        <button class="toggle" role="switch" aria-checked="true" aria-label="사용 여부"></button></div>
      <div class="row" style="padding:12px 0;border-top:1px solid var(--c-border);flex-wrap:wrap">
        <span class="badge badge--strong">잠김</span><button class="btn btn--outline btn--sm">잠금 해제</button>
        <button class="btn btn--outline btn--sm" data-open="reset">비밀번호 초기화</button></div>
    </div>
    <div class="form-actions"><a class="btn btn--ghost" href="B60.html">취소</a><a class="btn btn--primary" href="B60.html">저장</a></div>
  </form>
</section>
</main>
<div class="modal-backdrop" id="reset"><div class="modal" role="dialog" aria-labelledby="reset-t">
  <h2 class="modal__title" id="reset-t">비밀번호를 초기화할까요?</h2><p class="modal__text">임시 비밀번호를 담당자의 업무 이메일로 보냅니다. 담당자는 첫 로그인 때 비밀번호를 바꿔야 합니다.</p>
  <div class="modal__actions"><button class="btn btn--outline" data-close>취소</button><button class="btn btn--primary" data-close>초기화</button></div></div></div>
<script src="../js/proto.js"></script>
</body>
</html>
