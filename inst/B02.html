<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B02 비밀번호 찾기 | 알려드림 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/proto.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-body">
<!-- 화면 ID: B02 / 비밀번호 찾기 -->
<main class="auth">

<div class="auth__brand"><h1>비밀번호 찾기</h1><p>업무 이메일로 재설정 링크를 보내 드립니다</p></div>
<div data-state="default">
<form class="form" onsubmit="return false">
  <div class="field"><label class="field__label"><span>아이디 </span><span class="field__req">필수</span></label><input class="input" placeholder="아이디"></div>
  <div class="field"><label class="field__label"><span>업무 이메일 </span><span class="field__req">필수</span></label><input class="input" type="email" placeholder="name@example.go.kr"></div>
  <a class="btn btn--primary btn--block" href="?state=sent">재설정 링크 보내기</a>
</form>
</div>
<div data-state="sent">
  <div class="notice"><i data-lucide="mail-check"></i><p>입력하신 정보가 맞으면 업무 이메일로 비밀번호 재설정 링크를 보냈습니다. 링크는 30분 동안 쓸 수 있습니다.</p></div>
  <a class="btn btn--outline btn--block mt-6" href="B01.html">로그인으로 돌아가기</a>
</div>
<div class="auth__links"><a href="B01.html">로그인</a></div>
<p class="muted small mt-6">잠긴 계정은 잠금을 먼저 풀어야 비밀번호를 찾을 수 있습니다.</p>
</main>

<script src="../js/proto.js"></script>
</body>
</html>
