<body data-area="local" data-menu="C42">
<!-- 화면 ID: C42 / 로그 보관 -->
<main class="admin-main">
  <div class="page-head"><div><p class="crumb">환경 설정</p><h1>로그 보관</h1></div><div class="page-head__actions"><span class="badge"><i data-lucide="shield"></i>폐쇄망 동작</span></div></div>

    <div class="field"><label class="field__label"><span>발송 이력 보관 기간 </span></label><select class="select" style="max-width:240px"><option>6개월</option><option selected>1년 (기본)</option><option>2년</option><option>3년</option></select></div>
